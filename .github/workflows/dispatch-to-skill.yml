# Fires a repository_dispatch event on the skill repo whenever this
# template changes, so the skill's scaffold-e2e workflow re-runs against
# the new template.
#
# Requires a repo secret `DISPATCH_TOKEN` — a personal access token with
# `contents: read` + `actions: write` scope on the skill repo. See
# RELEASING.md in the skill repo for setup instructions.

name: dispatch-to-skill

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.repository == 'brianckeegan/data-liberation-template'
    steps:
      - name: Dispatch template-updated event to skill repo
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::DISPATCH_TOKEN secret is not set; skipping dispatch."
            exit 0
          fi
          curl -sSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/brianckeegan/data-liberation-skill/dispatches \
            -d "$(cat <<EOF
          {
            "event_type": "template-updated",
            "client_payload": {
              "ref": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "reason": "push to data-liberation-template main"
            }
          }
          EOF
          )"
          echo "✓ Dispatched template-updated to data-liberation-skill"
